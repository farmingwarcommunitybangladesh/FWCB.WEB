<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clans | FWCB</title>

    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  </head>
  <body>
    <header id="navbar">
      <nav class="glass-panel">
        <div class="logo">
          <span class="logo-text">FW<span class="highlight">CB</span></span>
        </div>
        <ul class="nav-links">
          <li>
            <a href="index.html"><i class="ri-home-4-line"></i> Home</a>
          </li>
          <li>
            <a href="clans.html" class="active"><i class="ri-shield-star-line"></i> Clans</a>
          </li>
          <li>
            <a href="discord.html"><i class="ri-discord-line"></i> Social</a>
          </li>
          <li>
            <a href="bases.html"><i class="ri-layout-masonry-line"></i> Bases</a>
          </li>
          <li>
            <a href="rules.html"><i class="ri-book-open-line"></i> Rules</a>
          </li>
          <li>
            <a href="about.html"><i class="ri-team-line"></i> About</a>
          </li>
        </ul>
        <div class="mobile-toggle">
          <i class="ri-menu-4-line"></i>
        </div>
      </nav>
    </header>

    <main>
      <!-- Page Header -->
      <section class="page-header">
        <div class="container">
          <h1 class="page-title">Active <span class="highlight">Divisions</span></h1>
          <p class="page-subtitle">Real-time intelligence on all allied units. Access operational data below.</p>

          <!-- Command Bar (Search) Container -->
          <div id="command-bar-container" class="search-container"></div>
        </div>
      </section>

      <!-- The Grid -->
      <section class="clans-grid-section">
        <div class="container">
          <div id="clan-list" class="grid-layout">
            <!-- JS will inject holographic cards here -->
          </div>
        </div>
      </section>
    </main>
    <div id="modern-clan-list" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 20px;"></div>

<script>
  // clans.json থেকে ডেটা নিয়ে আসার কোড
  fetch('clans.json')
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById('modern-clan-list');
      let output = '';
      
      data.forEach(clan => {
        output += `
          <div style="background: #1e1e1e; color: white; padding: 20px; border-radius: 10px; text-align: center; width: 250px; box-shadow: 0 4px 8px rgba(0,0,0,0.5);">
            <img src="${clan.badgeUrl}" alt="${clan.name}" style="width: 100px; height: 100px; margin-bottom: 10px;">
            <h3 style="margin: 0; color: #ffcc00; font-family: sans-serif;">${clan.name}</h3>
            <p style="margin: 5px 0; font-family: sans-serif;"><strong>Tag:</strong> ${clan.tag}</p>
            <p style="margin: 5px 0; font-family: sans-serif;"><strong>Level:</strong> ${clan.level}</p>
            <p style="margin: 5px 0; font-family: sans-serif;"><strong>League:</strong> ${clan.warLeague}</p>
          </div>
        `;
      });
      
      container.innerHTML = output;
    })
    .catch(error => console.error('Error loading clans:', error));
</script>
    <script src="script.js"></script>
  </body>

  <script src="live-update.js"></script>
  <div id="clans-container"></div>
</html>
